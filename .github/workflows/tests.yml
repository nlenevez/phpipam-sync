# Tests need no network, phpIPAM instance or credentials.
# 3.9 is the supported minimum. setup-python has no 3.9 build for Ubuntu
# 26.04 (ubuntu-latest), so 3.9 runs on 24.04.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

# Copy to phpipam-sync.yml at the root of a data repo. No secrets here:
# the token comes from the variable named by token_env (or token_command).
source:
  base_url: https://ipam.example.net      # no trailing slash, no /api/
  app_id: export                          # API app: Read, SSL with App code,
                                          # Nest custom fields = Yes
  token_env: PHPIPAM_SRC_TOKEN
  verify_ssl: true
  timeout: 30

# Everything the API app can see:
sections: all
# Or scope the export to particular sections:
# sections:
#   - Networks

options:
  sync_tags: true
